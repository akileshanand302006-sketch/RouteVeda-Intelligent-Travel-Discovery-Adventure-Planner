<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1200" height="800" fill="url(#skyGrad)" />

  <!-- Natural Scenery Illustration Layer -->
  
      <!-- Tropical Golden Sunset -->
      <circle cx="600" cy="280" r="160" fill="#f59e0b" opacity="0.5" filter="blur(40px)" />
      <circle cx="600" cy="280" r="85" fill="#fef08a" opacity="0.9" />

      <!-- Calm Ocean Horizon & Reflection -->
      <rect x="0" y="440" width="1200" height="360" fill="#0369a1" />
      <ellipse cx="600" cy="480" rx="280" ry="18" fill="#fde047" opacity="0.4" filter="blur(8px)" />
      <ellipse cx="600" cy="540" rx="360" ry="24" fill="#38bdf8" opacity="0.3" filter="blur(12px)" />

      <!-- Curved Shoreline & Waves -->
      <path d="M 0,580 Q 400,530 800,620 T 1200,600 L 1200,800 L 0,800 Z" fill="#0284c7" opacity="0.75" />
      <path d="M 0,660 Q 500,600 900,690 T 1200,680 L 1200,800 L 0,800 Z" fill="#0f172a" opacity="0.9" />

      <!-- Silhouetted Coconut Palm Trees -->
      <g fill="#021f3f" opacity="0.8">
        <path d="M 120,800 Q 140,550 220,440 Q 230,445 220,800 Z" />
        <path d="M 220,440 Q 150,400 100,430 Q 160,430 220,440 Q 260,390 320,410 Q 270,430 220,440 Q 240,490 280,530 Q 230,480 220,440 Q 180,480 140,520 Q 190,470 220,440 Z" />
        <path d="M 1080,800 Q 1060,560 980,460 Q 970,465 980,800 Z" />
        <path d="M 980,460 Q 1050,420 1100,450 Q 1040,450 980,460 Q 940,410 880,430 Q 930,450 980,460 Q 960,510 920,550 Q 970,500 980,460 Q 1020,500 1060,540 Q 1010,490 980,460 Z" />
      </g>
    

  <!-- Lower Ambient Vignette Overlay -->
  <rect width="1200" height="800" fill="url(#skyGrad)" opacity="0.2" />

  <!-- Glass Card Detail Overlay -->
  <rect x="120" y="160" width="960" height="480" rx="32" fill="rgba(15, 23, 42, 0.72)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2" filter="url(#cardShadow)" />

  <!-- Category & Region Badge -->
  <rect x="170" y="210" width="240" height="38" rx="19" fill="#0ea5e9" opacity="0.95" />
  <text x="290" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    HERITAGE • SOUTH
  </text>

  <!-- Title -->
  <text x="170" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#ffffff">
    Mahabalipuram (Mamallapuram)
  </text>

  <!-- Location -->
  <text x="170" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="rgba(255, 255, 255, 0.88)">
    📍 Mahabalipuram (Mamallapuram), Tamil Nadu
  </text>

  <!-- Divider -->
  <line x1="170" y1="420" x2="1030" y2="420" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Highlights & Key Info -->
  <text x="170" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="rgba(255, 255, 255, 0.78)">
    ✨ Shore Temple by the Sea • Arjuna's Penance Giant Relief • Pancha Rathas Monoliths
  </text>

  <text x="170" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="rgba(255, 255, 255, 0.65)">
    🗓️ Best Season: November to February • ⏱️ Ideal Duration: 1-2 days
  </text>

  <!-- Bottom Brand Footer -->
  <text x="170" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" letter-spacing="1">
    ✦ TRIPFORGE VERIFIED SCENERY &amp; GUIDE
  </text>
  <text x="1030" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="rgba(255, 255, 255, 0.5)" text-anchor="end">
    Starting from ₹4,600/person
  </text>
</svg>