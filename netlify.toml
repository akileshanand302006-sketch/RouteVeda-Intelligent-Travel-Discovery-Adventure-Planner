# Netlify Production Deployment Configuration for RouteVeda (Angular SPA)

[build]
  command = "node ./node_modules/@angular/cli/bin/ng.js build --configuration production"
  publish = "dist/tripforge/browser"

# SPA Routing: Redirect all routes to index.html with 200 HTTP status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
